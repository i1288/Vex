[package]
name = "vex"
version = "0.3.0"
edition = "2024"
description = "A fast code editor that looks like VS Code and edits like Vim"
repository = "https://github.com/i1288/Vex"

[dependencies]
eframe = "0.37"
portable-pty = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
vt100 = "0.18"

[build-dependencies]
winresource = "0.1"
