[package]
name = "vex"
version = "0.5.1"
edition = "2024"
description = "A fast code editor that looks like VS Code and edits like Vim"
repository = "https://github.com/i1288/Vex"

[dependencies]
eframe = "0.37"
portable-pty = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-yaml = "0.7"
vt100 = "0.18"

[build-dependencies]
winresource = "0.1"

[profile.release]
# Smaller, faster release binaries: whole-program optimization and no debug symbols.
lto = "fat"
codegen-units = 1
strip = true
